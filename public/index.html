<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>运维工具箱 · Ops Toolbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231d4ed8'/%3E%3Cpath d='M20.8 6.6a5.4 5.4 0 0 0-6.9 6.9L7 20.4a2.7 2.7 0 0 0 3.8 3.8l6.9-6.9a5.4 5.4 0 0 0 6.9-6.9l-3 3-3-.7-.7-3z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./css/style.css" />
<script>window.Prism = window.Prism || {}; window.Prism.manual = true;</script>
<script src="./vendor/prism.js"></script>
<script src="./vendor/prism-json.min.js"></script>
<script src="./vendor/prism-yaml.min.js"></script>
<script src="./vendor/marked.umd.js"></script>
<script src="./vendor/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M20.8 6.6a5.4 5.4 0 0 0-6.9 6.9L7 20.4a2.7 2.7 0 0 0 3.8 3.8l6.9-6.9a5.4 5.4 0 0 0 6.9-6.9l-3 3-3-.7-.7-3z" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="brand-name">运维工具箱</div>
        <button class="drawer-close" id="navClose" type="button" aria-label="关闭菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="search-box">
        <input id="navSearch" type="text" placeholder="搜索工具…" autocomplete="off" />
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <span id="clockNow">--:--:--</span>
        <button class="btn btn-sm btn-ghost" id="themeToggle" title="切换主题"></button>
      </div>
    </aside>
    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <div class="main">
      <header class="page-head">
        <button class="menu-btn" id="navToggle" type="button" aria-label="打开菜单" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="page-ico" id="pageIcon" aria-hidden="true"></div>
        <div class="page-head-main">
          <div class="page-title-row">
            <h1 class="page-title" id="toolTitle">运维工具箱</h1>
            <span class="page-group" id="toolGroup">网络工具</span>
          </div>
          <p class="page-desc" id="toolDesc">选择一个工具开始使用</p>
        </div>
        <div class="page-side">
          <span class="page-mode" id="toolMode"><span class="dot"></span>纯本地运算</span>
        </div>
      </header>
      <div class="content">
        <div class="content-inner" id="view"></div>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
